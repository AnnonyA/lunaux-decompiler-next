name: Apply Stage 2 transfer

on:
  push:
    branches: [next/stage2-setlist-tableinit]
    paths:
      - ".stage2/**"
      - ".github/workflows/stage2-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Reassemble and verify patch
        shell: bash
        run: |
          cat .stage2/*.part > /tmp/stage2.patch
          awk '/^diff --git a\/README.md b\/README.md$/{exit} {print}' /tmp/stage2.patch > /tmp/stage2-core.patch
          echo "2ee411d4e6ae76d585aa0cb639ff3ba60cbba95afe3a246cb5f46cf3a7368df6  /tmp/stage2-core.patch" | sha256sum -c -
          git apply --check /tmp/stage2.patch
          git apply /tmp/stage2.patch
      - name: Validate Stage 2
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q
          ruff check .
          mypy
          git diff --check
      - name: Commit applied Stage 2
        shell: bash
        run: |
          rm -rf .stage2
          git rm .github/workflows/stage2-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Stage 2 SETLIST semantic recovery"
          git push origin HEAD:next/stage2-setlist-tableinit
