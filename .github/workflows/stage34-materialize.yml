name: Stage34 materialize validated lifter

on:
  push:
    branches:
      - stage34/ssa-callframe-rmw
    paths:
      - .stage34/lifter.patch

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact validated lifter patch
        run: |
          git apply --check .stage34/lifter.patch
          git apply .stage34/lifter.patch
          rm -f .stage34/lifter.patch
          rmdir .stage34 2>/dev/null || true
          rm -f .github/workflows/stage34-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize validated Stage 3 + 4 lifter changes"
          git push origin HEAD:stage34/ssa-callframe-rmw
