name: Fix symbol recovery behavior

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/symbol-recovery-v010
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply behavior corrections
        run: python scripts/fix_symbol_recovery_behavior.py
      - name: Commit corrected behavior
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lunaux/backends/symbols.py tests/test_bytecode_engine.py tests/test_lifter_inlining.py tests/test_symbol_recovery.py
          git commit -m "Fix call evidence and update smart naming regressions"
          git push origin HEAD:feature/symbol-recovery-v010
