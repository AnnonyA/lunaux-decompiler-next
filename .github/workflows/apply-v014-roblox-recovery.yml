name: Apply v0.14 Roblox recovery

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/roblox-events-callbacks-modules-v014'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/roblox-events-callbacks-modules-v014
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Apply v0.14 recovery
        run: python scripts/apply_v014_roblox_recovery.py
      - name: Format generated code
        run: |
          ruff format src/lunaux/backends/lifter.py src/lunaux/backends/roblox_recovery.py src/lunaux/backends/roblox_patterns.py src/lunaux/backends/symbols.py src/lunaux/backends/table_recovery.py src/lunaux/models.py tests/test_roblox_recovery_v014.py
          ruff check --fix src/lunaux/backends/lifter.py src/lunaux/backends/roblox_recovery.py src/lunaux/backends/roblox_patterns.py src/lunaux/backends/symbols.py src/lunaux/backends/table_recovery.py src/lunaux/models.py tests/test_roblox_recovery_v014.py
      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/ROBLOX_EVENTS_CALLBACKS_MODULES.md examples/api_script.luau pyproject.toml src/lunaux tests/test_roblox_recovery_v014.py
          git commit -m 'Implement LunaUX 0.14 Roblox events callbacks and modules'
          git push origin HEAD:feature/roblox-events-callbacks-modules-v014
