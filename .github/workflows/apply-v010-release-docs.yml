name: Apply v0.10 release documentation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/symbol-recovery-v010
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply release documentation
        run: python scripts/apply_v010_release_docs.py
      - name: Commit release documentation
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md examples/api_script.luau
          git commit -m "Document v0.10 recovery features and options"
          git push origin HEAD:feature/symbol-recovery-v010
