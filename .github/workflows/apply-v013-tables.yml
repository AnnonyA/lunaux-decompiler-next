name: Apply v0.13 table reconstruction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/full-table-reconstruction-v013'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-table-reconstruction-v013
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v0.13 implementation
        run: python scripts/apply_v013_tables.py
      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/lunaux/__init__.py src/lunaux/backends/lifter.py src/lunaux/backends/table_recovery.py tests/test_table_recovery_v013.py
          git commit -m "Implement full table reconstruction for v0.13"
          git push origin HEAD:feature/full-table-reconstruction-v013
