name: Apply Stage 2 patch

on:
  push:
    branches:
      - next/stage2-setlist-tableinit

permissions:
  contents: write

jobs:
  apply-stage2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next/stage2-setlist-tableinit
          fetch-depth: 0
      - name: Apply audited Stage 2 patch
        shell: bash
        run: |
          cat .stage2/*.part > /tmp/stage2.patch
          git apply --check /tmp/stage2.patch
          git apply /tmp/stage2.patch
          rm -rf .stage2
          rm .github/workflows/apply-stage2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Stage 2 SETLIST table recovery"
          git push origin HEAD:next/stage2-setlist-tableinit
