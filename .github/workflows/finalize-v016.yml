name: Finalize v0.16 release

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feature/metatable-contextual-functions-v016'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/metatable-contextual-functions-v016
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Finalize documentation
        run: python scripts/finalize_v016.py
      - name: Remove temporary finalizer
        run: rm scripts/finalize_v016.py .github/workflows/finalize-v016.yml
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate final release diff
        run: |
          ruff format src/lunaux/backends src/lunaux/models.py tests/test_metatable_classes_v016.py tests/test_options_v016.py tests/test_roblox_recovery_v014.py
          ruff check . --fix
          ruff check .
          mypy
          pytest --cov=lunaux --cov-report=term-missing
      - name: Commit final release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize LunaUX Next 0.16.0"
          git push origin HEAD:feature/metatable-contextual-functions-v016
