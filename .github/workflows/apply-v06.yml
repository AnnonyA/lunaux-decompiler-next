name: Apply LunaUX v0.6 payload

on:
  push:
    branches:
      - feature/luau-bytecode-v13-complete-opcodes
    paths:
      - ".bootstrap-v06/**"
      - ".github/workflows/apply-v06.yml"
  pull_request:
    branches: [main]
    paths:
      - ".bootstrap-v06/**"
      - ".github/workflows/apply-v06.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/luau-bytecode-v13-complete-opcodes' || github.ref_name == 'feature/luau-bytecode-v13-complete-opcodes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/luau-bytecode-v13-complete-opcodes
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .bootstrap-v06/apply.py
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand Luau bytecode v13 support"
          git push origin HEAD:feature/luau-bytecode-v13-complete-opcodes
