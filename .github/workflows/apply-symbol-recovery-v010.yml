name: Apply symbol recovery v0.10 corrections

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/symbol-recovery-v010
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply source corrections
        run: python scripts/apply_symbol_recovery_v010.py
      - name: Commit corrected source
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lunaux/backends/lifter.py src/lunaux/backends/symbols.py src/lunaux/backends/classes.py
          git commit -m "Fix symbol recovery typing and formatting"
          git push origin HEAD:feature/symbol-recovery-v010
