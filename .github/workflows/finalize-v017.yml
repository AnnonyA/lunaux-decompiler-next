name: Finalize v0.17 release

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feature/advanced-loops-state-machine-v017'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/advanced-loops-state-machine-v017
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Finalize and harden cyclic analyses
        run: python scripts/finalize_v017.py
      - name: Remove temporary finalizer
        run: rm scripts/finalize_v017.py .github/workflows/finalize-v017.yml
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Format and validate release
        run: |
          ruff format \
            src/lunaux/backends/__init__.py \
            src/lunaux/backends/advanced_loops.py \
            src/lunaux/backends/flow_types.py \
            src/lunaux/backends/lifter.py \
            src/lunaux/backends/reconstructed.py \
            src/lunaux/backends/state_machine.py \
            src/lunaux/backends/structuring.py \
            src/lunaux/models.py \
            tests/test_advanced_control_flow_v017.py \
            tests/test_v017_output_and_options.py
          ruff check \
            src/lunaux/backends/__init__.py \
            src/lunaux/backends/advanced_loops.py \
            src/lunaux/backends/flow_types.py \
            src/lunaux/backends/lifter.py \
            src/lunaux/backends/reconstructed.py \
            src/lunaux/backends/state_machine.py \
            src/lunaux/backends/structuring.py \
            src/lunaux/models.py \
            tests/test_advanced_control_flow_v017.py \
            tests/test_v017_output_and_options.py \
            --fix
          ruff check .
          mypy
          timeout 60s pytest -vv -s -o faulthandler_timeout=25 \
            tests/test_v017_output_and_options.py
          pytest --cov=lunaux --cov-report=term-missing
      - name: Commit final release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize LunaUX 0.17 advanced control-flow release"
          git push origin HEAD:feature/advanced-loops-state-machine-v017
