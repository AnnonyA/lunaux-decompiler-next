name: Apply LunaUX 0.7 README

on:
  push:
    branches:
      - feature/compiler-analysis-v07
    paths:
      - "scripts/apply_readme_v07.py"
      - ".github/workflows/apply-readme-v07.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compiler-analysis-v07
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update documentation
        run: |
          if [ -f scripts/apply_readme_v07.py ]; then
            python scripts/apply_readme_v07.py
          fi
      - name: Commit documentation
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document LunaUX compiler analysis 0.7"
          git push origin HEAD:feature/compiler-analysis-v07
