[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "byteweft"
version = "0.21.0.dev0"
description = "An evidence-driven Luau bytecode decompiler with structural SSA recovery"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "AnnonyA" }]
keywords = ["luau", "roblox", "bytecode", "decompiler", "disassembler"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
byteweft = "lunaux.cli:app"
lunaux = "lunaux.cli:app"

[project.urls]
Homepage = "https://github.com/AnnonyA/lunaux-decompiler-next"
Repository = "https://github.com/AnnonyA/lunaux-decompiler-next"
Issues = "https://github.com/AnnonyA/lunaux-decompiler-next/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lunaux"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["lunaux"]
