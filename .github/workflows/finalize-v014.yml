name: Finalize v0.14 implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/roblox-events-callbacks-modules-v014'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/roblox-events-callbacks-modules-v014
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize generated implementation
        run: python scripts/finalize_v014.py
      - name: Commit permanent files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize LunaUX 0.14 implementation'
          git push origin HEAD:feature/roblox-events-callbacks-modules-v014
