name: Apply v0.17 integration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/advanced-loops-state-machine-v017'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/advanced-loops-state-machine-v017
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply lifter integration
        run: python scripts/apply_v017.py
      - name: Remove temporary application files
        run: rm scripts/apply_v017.py .github/workflows/apply-v017.yml
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Format and validate
        run: |
          ruff format src/lunaux/backends/advanced_loops.py src/lunaux/backends/state_machine.py src/lunaux/backends/lifter.py src/lunaux/models.py
          ruff check src/lunaux/backends/advanced_loops.py src/lunaux/backends/state_machine.py src/lunaux/backends/lifter.py src/lunaux/models.py --fix
          ruff check .
          mypy
          pytest --cov=lunaux --cov-report=term-missing
      - name: Commit permanent integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate advanced loops and state-machine unflattening"
          git push origin HEAD:feature/advanced-loops-state-machine-v017
