name: Stage56 materialize

on:
  push:
    branches: ["stage56/materialize"]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply exact validated lifter patch
        shell: bash
        run: |
          cat .stage56/lifter.part1.patch .stage56/lifter.part2.patch .stage56/lifter.part3.patch > /tmp/lifter.patch
          git apply --check /tmp/lifter.patch
          git apply /tmp/lifter.patch
          test "$(git hash-object src/lunaux/backends/lifter.py)" = "ecc7b36c91b544edb945780a34ce7bc3e109fcf7"
      - name: Remove materialization files and commit exact tree
        shell: bash
        run: |
          rm -rf .stage56 .github/workflows/stage56-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize Stage 5 + 6 validated tree [skip ci]"
          git push origin HEAD:stage56/materialize
