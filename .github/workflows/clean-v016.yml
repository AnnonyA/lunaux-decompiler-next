name: Clean v0.16 diff

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  clean:
    if: github.head_ref == 'feature/metatable-contextual-functions-v016'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/metatable-contextual-functions-v016
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore unrelated formatted files
        run: |
          git checkout origin/main -- \
            src/lunaux/backends/analysis.py \
            src/lunaux/backends/auto.py \
            src/lunaux/backends/bytecode.py \
            src/lunaux/backends/inlining.py \
            src/lunaux/backends/opcode_encoding.py \
            src/lunaux/backends/opcodes.py \
            src/lunaux/backends/ssa.py \
            src/lunaux/backends/structuring.py \
            src/lunaux/backends/unluau.py
          rm .github/workflows/clean-v016.yml
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate cleaned release
        run: |
          ruff check .
          mypy
          pytest --cov=lunaux --cov-report=term-missing
      - name: Commit cleaned diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove unrelated formatting from v0.16"
          git push origin HEAD:feature/metatable-contextual-functions-v016
