name: Fix v0.14 generator

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/roblox-events-callbacks-modules-v014'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/roblox-events-callbacks-modules-v014
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix generator marker
        run: python scripts/fix_v014_generator.py
      - name: Commit generator correction
        run: |
          if git diff --quiet; then
            echo 'No generator changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply_v014_roblox_recovery.py
          git commit -m 'Fix LunaUX 0.14 README generator marker'
          git push origin HEAD:feature/roblox-events-callbacks-modules-v014
