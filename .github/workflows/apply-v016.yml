name: Apply v0.16 integration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/metatable-contextual-functions-v016'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/metatable-contextual-functions-v016
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply lifter integration
        run: python scripts/apply_v016.py
      - name: Remove temporary application files
        run: rm scripts/apply_v016.py .github/workflows/apply-v016.yml
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Format and validate
        run: |
          ruff format src/lunaux/backends/classes.py src/lunaux/backends/contextual_functions.py src/lunaux/backends/lifter.py src/lunaux/models.py tests/test_metatable_classes_v016.py
          ruff check src/lunaux/backends/classes.py src/lunaux/backends/contextual_functions.py src/lunaux/backends/lifter.py src/lunaux/models.py tests/test_metatable_classes_v016.py --fix
          ruff check .
          mypy
          pytest --cov=lunaux --cov-report=term-missing
      - name: Commit permanent implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate metatable classes and contextual functions"
          git push origin HEAD:feature/metatable-contextual-functions-v016
