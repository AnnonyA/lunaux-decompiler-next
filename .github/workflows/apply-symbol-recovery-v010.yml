name: Apply symbol recovery v0.10

on:
  push:
    branches:
      - feature/symbol-recovery-v010
    paths:
      - "scripts/apply_symbol_recovery_v010.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/symbol-recovery-v010
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply lifter integration
        run: python scripts/apply_symbol_recovery_v010.py
      - name: Commit generated source
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lunaux/backends/lifter.py
          git commit -m "Integrate evidence-based symbol recovery"
          git push origin HEAD:feature/symbol-recovery-v010
