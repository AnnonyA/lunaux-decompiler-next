name: Update README for LunaUX 0.9

on:
  push:
    branches:
      - feature/ast-precedence-v09
    paths:
      - "scripts/update_readme_v09.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ast-precedence-v09
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update README
        run: python scripts/update_readme_v09.py
      - name: Commit README
        run: |
          if git diff --quiet; then
            echo "No README changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Document LunaUX Next 0.9 AST and scope recovery"
          git push origin HEAD:feature/ast-precedence-v09
