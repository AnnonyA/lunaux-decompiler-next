name: Cancel obsolete v0.17 CI

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'feature/advanced-loops-state-machine-v017'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/advanced-loops-state-machine-v017
          fetch-depth: 0
      - name: Cancel older CI runs for this branch
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                branch: 'feature/advanced-loops-state-machine-v017',
                event: 'pull_request',
                per_page: 100,
              }
            );
            for (const run of runs) {
              if (
                run.name === 'CI' &&
                run.id !== context.runId &&
                (run.status === 'queued' || run.status === 'in_progress')
              ) {
                core.info(`Cancelling obsolete CI run ${run.id}`);
                await github.rest.actions.cancelWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
              }
            }
      - name: Remove temporary cleanup workflow
        run: rm .github/workflows/cancel-obsolete-v017.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary CI cleanup workflow"
          git push origin HEAD:feature/advanced-loops-state-machine-v017
