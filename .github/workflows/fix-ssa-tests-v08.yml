name: Fix LunaUX 0.8 SSA regressions

on:
  push:
    branches:
      - feature/ssa-expression-v08
    paths:
      - "scripts/fix_ssa_tests_v08.py"
      - ".github/workflows/fix-ssa-tests-v08.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ssa-expression-v08
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply SSA fixes
        run: |
          if [ -f scripts/fix_ssa_tests_v08.py ]; then
            python scripts/fix_ssa_tests_v08.py
          fi
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix SSA typing and update inlining regressions"
          git push origin HEAD:feature/ssa-expression-v08
