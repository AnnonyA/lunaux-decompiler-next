name: Fix final v0.10 regressions

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/symbol-recovery-v010
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply final corrections
        run: python scripts/fix_v010_final_regressions.py
      - name: Commit final corrections
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lunaux/backends/symbols.py tests/test_bytecode_engine.py tests/test_lifter_inlining.py
          git commit -m "Fix final smart naming regressions"
          git push origin HEAD:feature/symbol-recovery-v010
