name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=lunaux --cov-report=term-missing

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: mypy

  patch-v015-flow-aliases:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/flow-sensitive-roblox-types-v015'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/flow-sensitive-roblox-types-v015
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply alias-aware flow patch
        run: |
          python scripts/patch_v015_flow_aliases.py
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
      - name: Validate patched implementation
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check .
          mypy
          pytest --cov=lunaux --cov-report=term-missing
      - name: Commit patched implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Track flow refinements through register aliases"
          git push origin HEAD:feature/flow-sensitive-roblox-types-v015
